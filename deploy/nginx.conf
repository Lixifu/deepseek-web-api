worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream backend { server app:8000; }

    server {
        listen 80;
        server_name _;
        # 重定向到 HTTPS（生产启用）
        # return 301 https://$host$request_uri;
        location / { proxy_pass http://backend; }
    }

    server {
        listen 443 ssl http2;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # 管理后台静态资源
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        # 注意：docker-compose 未挂载前端静态资源到 nginx，
        # 生产应把 web/dist 挂到 /usr/share/nginx/html，或直接由 app 服务托管。

        location /v1/    { proxy_pass http://backend; }
        location /admin/ { proxy_pass http://backend; }
        location /healthz { proxy_pass http://backend; }

        # SSE 关键：关闭缓冲、加大超时
        location /v1/chat/completions {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }
    }
}
